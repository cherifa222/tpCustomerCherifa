<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title>Liste des clients</title>
    </h:head>

    <h:body>

        <h:form>
            <p:dataTable value="#{customerBean.customers}" var="item"
                         widgetVar="customerTable"
                         emptyMessage="Aucun client avec ce critère"
                         paginator="true"
                         rows="10"
                         rowsPerPageTemplate="2,4,8,10"
                         paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">

                <f:facet name="header">
                    <p:outputPanel>
                        <h:outputText value="Recherche dans tous les champs de recherche : "/>
                        <p:inputText id="globalFilter" onkeyup="PF('customerTable').filter()"
                                     style="width:150px"/>
                    </p:outputPanel>
                </f:facet>

                <p:column>
                    <f:facet name="header">
                        <h:outputText value="Id"/>
                    </f:facet>
                    <h:link outcome="customerDetails?idCustomer=#{item.clientID}"
                            value="#{item.clientID}"/>
                </p:column>

                <p:column sortBy="#{item.nom}" filterBy="#{item.nom}">
                    <f:facet name="header">
                        <h:outputText value="Nom"/>
                    </f:facet>
                    <h:outputText value="#{item.nom}"/>
                </p:column>

                <p:column sortBy="#{item.ville}">
                    <f:facet name="header">
                        <h:outputText value="Ville"/>
                    </f:facet>
                    <h:outputText value="#{item.ville}"/>
                </p:column>

                <p:column sortBy="#{item.etat}" filterBy="#{item.etat}">
                    <f:facet name="header">
                        <h:outputText value="Etat"/>
                    </f:facet>
                    <h:outputText value="#{item.etat}"/>
                </p:column>

                <p:column>
                    <f:facet name="header">
                        <h:outputText value="Taux de remise"/>
                    </f:facet>
                    <h:outputText value="#{item.compte.code} : #{item.compte.rate} %"/>
                </p:column>

            </p:dataTable>
        </h:form>

    </h:body>
</html>
