<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <h:head>
        <title>Liste des clients</title>
    </h:head>

    <h:body>

        <h:dataTable value="#{customerBean.customers}" var="item">

            <h:column>
                <f:facet name="header">
                    <h:outputText value="Id"/>
                </f:facet>
                <h:outputText value="#{item.clientID}"/>
            </h:column>

            <h:column>
                <f:facet name="header">
                    <h:outputText value="Nom"/>
                </f:facet>
                <h:outputText value="#{item.nom}"/>
            </h:column>

            <h:column>
                <f:facet name="header">
                    <h:outputText value="Ville"/>
                </f:facet>
                <h:outputText value="#{item.ville}"/>
            </h:column>

            <h:column>
                <f:facet name="header">
                    <h:outputText value="Taux de remise"/>
                </f:facet>
                <h:outputText value="#{item.compte.rate}"/>
            </h:column>

        </h:dataTable>

    </h:body>
</html>
